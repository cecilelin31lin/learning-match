<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>填空題測驗 - 自由填答</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Nunito', sans-serif;
    color: #2B3A55;
    min-height: 100vh;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 28px;
    color: #2B3A55;
    margin: 0 0 8px;
  }
  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #666;
    margin-bottom: 24px;
  }
  
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: white;
    border: 0.5px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .stat-label {
    font-size: 12px;
    color: #999;
    margin-bottom: 6px;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 600;
    color: #2B3A55;
  }
  .stat-value.success { color: #4CAF7D; }
  .stat-value.danger { color: #E24B4A; }
  
  .question-container {
    background: white;
    border: 0.5px solid #ddd;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .question-text {
    font-size: 16px;
    font-weight: 500;
    color: #2B3A55;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .input-group input {
    padding: 10px 12px;
    border: 0.5px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    background: white;
    transition: all 0.2s;
  }
  .input-group input:focus {
    outline: none;
    border-color: #378ADD;
    box-shadow: 0 0 0 2px rgba(55, 138, 221, 0.1);
  }
  
  .button-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: #378ADD;
    color: white;
  }
  .btn-primary:hover {
    background: #2970c7;
  }
  .btn-secondary {
    background: white;
    color: #2B3A55;
    border: 0.5px solid #ddd;
  }
  .btn-secondary:hover {
    background: #f9f9f9;
  }
  
  .feedback {
    display: none;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: center;
  }
  .feedback.show {
    display: block;
  }
  .feedback.success {
    background: #E8F9EF;
    border: 0.5px solid #4CAF7D;
    color: #2B6E4F;
  }
  .feedback.error {
    background: #FDE8E8;
    border: 0.5px solid #E24B4A;
    color: #8B2323;
  }
  .feedback-text {
    font-weight: 500;
    margin-bottom: 8px;
  }
  
  .result-container {
    display: none;
    background: white;
    border: 0.5px solid #ddd;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
  }
  .result-container.show {
    display: block;
  }
  .result-title {
    font-size: 18px;
    font-weight: 600;
    color: #2B3A55;
    margin-bottom: 20px;
  }
  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .result-stat {
    background: #f9f9f9;
    border-radius: 8px;
    padding: 16px;
  }
  .result-stat-label {
    font-size: 12px;
    color: #999;
    margin-bottom: 6px;
  }
  .result-stat-value {
    font-size: 28px;
    font-weight: 600;
    color: #2B3A55;
  }
  .result-stat-value.success { color: #4CAF7D; }
</style>
</head>
<body>
<div class="wrap">
  <h1>填空題測驗</h1>
  <p class="subtitle">請在下方填入正確答案</p>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">題目</div>
      <div class="stat-value" id="progress">1 / 4</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">⏱ 時間</div>
      <div class="stat-value" id="timer">0:00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">✓ 正確</div>
      <div class="stat-value success" id="correct">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">✗ 錯誤</div>
      <div class="stat-value danger" id="incorrect">0</div>
    </div>
  </div>

  <div id="questionContainer" class="question-container">
    <div class="question-text" id="question">1+1=__</div>
    <div class="input-group">
      <input type="text" id="answerInput" placeholder="輸入答案" onkeypress="handleKeyPress(event)">
    </div>
  </div>

  <div class="button-group">
    <button class="btn-primary" onclick="submitAnswer()">確認答案</button>
    <button class="btn-secondary" onclick="skipQuestion()">跳過</button>
  </div>

  <div id="feedbackContainer" class="feedback">
    <div class="feedback-text" id="feedbackText"></div>
    <button class="btn-primary" onclick="nextQuestion()">下一題</button>
  </div>

  <div id="resultContainer" class="result-container">
    <div class="result-title">答題完成</div>
    <div class="result-stats">
      <div class="result-stat">
        <div class="result-stat-label">正確率</div>
        <div class="result-stat-value success" id="accuracy">0%</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-label">總花費時間</div>
        <div class="result-stat-value" id="totalTime">0:00</div>
      </div>
    </div>
    <button class="btn-primary" onclick="location.reload()">重新開始</button>
  </div>
</div>

<script>
const quizData = [
  { question: '1+1=__', answer: '2' },
  { question: 'The capital of France is __', answer: 'Paris' },
  { question: '2×3=__', answer: '6' },
  { question: '在氣體狀態下，將原子的一個電子拔掉所需要的能量稱作 __', answer: 'IE' },
];

let currentQuestion = 0;
let correctCount = 0;
let incorrectCount = 0;
let startTime = Date.now();
let timerInterval = null;

function showQuestion() {
  const data = quizData[currentQuestion];
  document.getElementById('question').textContent = data.question;
  document.getElementById('progress').textContent = (currentQuestion + 1) + ' / ' + quizData.length;
  
  document.getElementById('answerInput').value = '';
  document.getElementById('answerInput').focus();
  document.getElementById('feedbackContainer').classList.remove('show');
}

function submitAnswer() {
  const input = document.getElementById('answerInput').value.trim();
  
  if (input === '') {
    alert('請輸入答案');
    return;
  }
  
  const correctAnswer = quizData[currentQuestion].answer;
  const correct = input.toLowerCase() === correctAnswer.toLowerCase();
  
  const feedback = document.getElementById('feedbackContainer');
  feedback.classList.add('show');
  
  if (correct) {
    correctCount++;
    document.getElementById('correct').textContent = correctCount;
    feedback.classList.add('success');
    feedback.classList.remove('error');
    document.getElementById('feedbackText').textContent = '✓ 正確';
  } else {
    incorrectCount++;
    document.getElementById('incorrect').textContent = incorrectCount;
    feedback.classList.add('error');
    feedback.classList.remove('success');
    document.getElementById('feedbackText').textContent = '✗ 錯誤，正確答案是：' + correctAnswer;
  }
}

function handleKeyPress(event) {
  if (event.key === 'Enter') {
    submitAnswer();
  }
}

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion >= quizData.length) {
    showResults();
  } else {
    showQuestion();
  }
}

function skipQuestion() {
  incorrectCount++;
  document.getElementById('incorrect').textContent = incorrectCount;
  nextQuestion();
}

function showResults() {
  document.getElementById('questionContainer').style.display = 'none';
  document.querySelector('.button-group').style.display = 'none';
  document.getElementById('feedbackContainer').classList.remove('show');
  
  const accuracy = Math.round((correctCount / quizData.length) * 100);
  document.getElementById('accuracy').textContent = accuracy + '%';
  
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;
  document.getElementById('totalTime').textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
  
  document.getElementById('resultContainer').classList.add('show');
}

function updateTimer() {
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;
    document.getElementById('timer').textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
  }, 100);
}

showQuestion();
updateTimer();
</script>
</body>
</html>
